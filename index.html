<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portal de Informática</title>
<link rel="stylesheet" href="css/estilos.css">
</head>
<body>
<header class="hero">
  <div class="badge">💻 PORTAL DE INFORMÁTICA</div>
  <h1>Aprende jugando</h1>
  <p>Selecciona tu nivel y encuentra las actividades disponibles.</p>
</header>

<main class="contenedor">
  <section>
    <h2>¿Qué nivel quieres practicar?</h2>
    <div id="niveles" class="grid"></div>
  </section>

  <section id="juegos" class="oculto">
    <div class="encabezado-seccion">
      <button id="volver" class="btn secundario">← Cambiar nivel</button>
      <h2 id="tituloNivel"></h2>
    </div>
    <div id="listaJuegos" class="grid juegos"></div>
  </section>
</main>

<footer>Portal educativo de Informática · Actividades interactivas</footer>
<script src="js/config.js"></script>
<script src="js/app.js"></script>
</body>
</html>
